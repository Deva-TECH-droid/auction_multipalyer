<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="IPL Mega Auction 2026 animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b24"/>
      <stop offset="0.55" stop-color="#0d1b4f"/>
      <stop offset="1" stop-color="#2a0f4a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="0.5" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ff9f1c"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <!-- pulsing spotlight -->
  <circle cx="450" cy="150" r="220" fill="url(#glow)">
    <animate attributeName="r" values="190;240;190" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- floating confetti / embers -->
  <g fill="#ffd54a">
    <circle cx="60"  cy="300" r="3"><animate attributeName="cy" values="310;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="300" r="2"><animate attributeName="cy" values="310;-10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="300" r="4"><animate attributeName="cy" values="310;-10" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="300" r="3"><animate attributeName="cy" values="310;-10" dur="6.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="300" r="2"><animate attributeName="cy" values="310;-10" dur="8.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="300" r="4"><animate attributeName="cy" values="310;-10" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="450" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="10" fill="#9fb4ff" opacity="0">
    LIVE · MULTIPLAYER · 7–10 OWNERS
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>
  <text x="450" y="178" text-anchor="middle" font-family="Impact, Segoe UI, Arial Black, sans-serif" font-size="64" font-weight="900" fill="url(#gold)">
    IPL MEGA AUCTION 2026
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- bid ladder that cycles -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="450" y="236" opacity="0">BID  ₹ 10.00 Cr
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.2;0.22;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="450" y="236" opacity="0">BID  ₹ 10.25 Cr
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.4;0.42;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="450" y="236" opacity="0" fill="#ff7a59">SNAP  ₹ 11.25 Cr
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.45;0.6;0.62;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="450" y="236" opacity="0" fill="#7dffb2">RTM MATCHED!
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.65;0.78;0.8;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="450" y="236" opacity="0" fill="#ffd54a" font-size="38">🔨 SOLD!
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.83;0.97;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- gavel -->
  <g transform="translate(790 70)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-35 40 90;12 40 90;-35 40 90" keyTimes="0;0.12;1" dur="8s" begin="0s" repeatCount="indefinite"/>
      <rect x="34" y="40" width="12" height="80" rx="5" fill="#c68642"/>
      <rect x="6" y="14" width="68" height="34" rx="8" fill="#ffd54a"/>
      <rect x="6" y="14" width="68" height="10" rx="5" fill="#fff3b0" opacity="0.7"/>
    </g>
    <rect x="-10" y="118" width="100" height="14" rx="6" fill="#c68642"/>
  </g>

  <!-- cricket ball -->
  <g transform="translate(95 80)">
    <animateTransform attributeName="transform" type="translate" values="95 80;95 62;95 80" dur="2.4s" repeatCount="indefinite"/>
    <circle r="26" fill="#c1121f"/>
    <path d="M-22 -12 Q0 0 -22 12" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
    <path d="M22 -12 Q0 0 22 12" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
  </g>
</svg>
